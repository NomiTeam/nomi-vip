Title: '&6会员控制台'
Layout:
  - '#########'
  - 'ABCDEFGHI'
  - '###J#R###'
  - '#########'
Options:
  Min-Click-Delay: 200
Icons:
  '#':
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  A:
    display:
      material: ARMOR_STAND
      name: '&a恢复正常体型'
    actions:
      all:
        - 'console: minecraft:attribute %player_name% minecraft:scale base set 1.0'
  B:
    display:
      material: ARMOR_STAND
      name: '&a体型 0.9'
    actions:
      all:
        - condition: perm nuomi.vip.vip
          actions:
            - 'console: minecraft:attribute %player_name% minecraft:scale base set 0.9'
          deny:
            - condition: perm nuomi.vip.svip
              actions:
                - 'console: minecraft:attribute %player_name% minecraft:scale base set 0.9'
              deny:
                - condition: perm nuomi.vip.mvip
                  actions:
                    - 'console: minecraft:attribute %player_name% minecraft:scale base set 0.9'
                  deny:
                    - 'tell: &c你的会员等级尚未解锁这个体型。'
