name: NomiVIP
version: 1.0.0
main: org.nomiteam.vip.NomiVIP
api-version: '26.3'
folia-supported: true
softdepend: [LuckPerms]
commands:
  nomivipgrant:
    description: 控制台会员临时组发货及保存完成反馈
  nuomifly:
    description: 切换当前会话自己的会员飞行
    aliases: [fly]
permissions:
  nuomi.vip.vip:
    default: false
  nuomi.vip.svip:
    default: false
  nuomi.vip.mvip:
    default: false
  nuomi.vip.fly.global:
    default: false
  nuomi.warp.free.2:
    default: false
  nuomi.warp.free.4:
    default: false
  nuomi.warp.free.6:
    default: false
  nuomi.warp.paid:
    default: false
